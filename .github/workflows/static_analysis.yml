name: Code Style (clang-format)

on:
  push:
  pull_request:

jobs:
  clang-format-check:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install LLVM (clang-format)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"   # match your local version if needed
          directory: ${{ runner.temp }}/llvm

      - name: Add LLVM to PATH
        run: echo "${{ runner.temp }}\llvm\bin" >> $env:GITHUB_PATH

      - name: Run clang-format check
        shell: bash
        run: |
          FILES=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' | grep -v '^lib/')
          clang-format --version
          diff -u <(cat $FILES) <(clang-format $FILES) || {
            echo "Code is not clang-formatted."
            exit 1
          }
